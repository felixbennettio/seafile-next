name: Unsigned retained client validation
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'desktop/**', 'sync/**', '.github/workflows/client-validation.yml']
permissions:
  contents: read
concurrency:
  group: retained-client-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Create an isolated validation workspace
        run: |
          validation_tmp=$(mktemp -d "$RUNNER_TEMP/android-validation.XXXXXX")
          echo "VALIDATION_TMP=$validation_tmp" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$validation_tmp/gradle" >> "$GITHUB_ENV"
          cp -R android "$validation_tmp/android"
      - name: Test the retained Android client without signing material
        run: |
          cd "$VALIDATION_TMP/android"
          ./gradlew testDebugUnitTest -PseafileValidationOnly=true --no-daemon
          python3 - <<'PY'
          from pathlib import Path
          assert not list(Path('app').rglob('*.apk')), 'Unit validation unexpectedly packaged an application'
          assert not list(Path('.').rglob('*.keystore')) and not list(Path('.').rglob('*.jks')), 'Unit validation unexpectedly created signing material'
          print('Unsigned validation produced no application package or signing store.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-unit-validation
          path: ${{ env.VALIDATION_TMP }}/android/app/build/reports/tests/
          retention-days: 7
      - name: Delete temporary validation files
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          value = os.environ.get('VALIDATION_TMP')
          if value:
              root = Path(value).resolve()
              assert root.is_relative_to(Path(os.environ['RUNNER_TEMP']).resolve()) and root.name.startswith('android-validation.')
              shutil.rmtree(root, ignore_errors=True)
          PY
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create a temporary build directory
        shell: bash
        run: |
          validation_tmp=$(mktemp -d "$RUNNER_TEMP/desktop-validation.XXXXXX")
          echo "VALIDATION_TMP=$validation_tmp" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
          dir: ${{ env.VALIDATION_TMP }}/qt
      - run: cmake -S desktop/tests -B "${{ env.VALIDATION_TMP }}/contracts"
      - run: cmake --build "${{ env.VALIDATION_TMP }}/contracts" --config Release
      - run: ctest --test-dir "${{ env.VALIDATION_TMP }}/contracts" -C Release --output-on-failure
      - name: Delete temporary validation files
        if: always()
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          value = os.environ.get('VALIDATION_TMP')
          if value:
              root = Path(value).resolve()
              assert root.is_relative_to(Path(os.environ['RUNNER_TEMP']).resolve()) and root.name.startswith('desktop-validation.')
              shutil.rmtree(root, ignore_errors=True)
