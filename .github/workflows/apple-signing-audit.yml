name: Audit reusable Apple signing
on:
  workflow_dispatch:
    inputs:
      cleanup_invalid_profiles:
        description: Remove only the four confirmed invalid pre-App-Group Seafile CI profiles
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: apple-signing
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyJWT[crypto]==2.10.1' 'cryptography>=45,<48'
      - name: Verify existing keys and list profile metadata without building
        env:
          GH_TOKEN: ${{ github.token }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CLEANUP_INVALID: ${{ inputs.cleanup_invalid_profiles }}
        run: |
          args=()
          if [[ "$CLEANUP_INVALID" == true ]]; then args+=(--cleanup-invalid-profiles); fi
          python tools/apple_signing_audit.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: apple-signing-audit
          path: signing-audit.json
          if-no-files-found: error
