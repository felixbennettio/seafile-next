name: Audit reusable Apple signing
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-signing
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyJWT[crypto]==2.10.1' 'cryptography>=45,<48'
      - name: Verify only this project's existing signing keys and profiles
        env:
          GH_TOKEN: ${{ github.token }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python tools/apple_signing_audit.py
