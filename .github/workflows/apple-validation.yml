name: Native Apple validation
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Native regression scope; all targets are compiled
        type: choice
        default: full
        options: [full, photos, sign-in, media, files, localization, documents, settings]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26
        run: |
          xcode_path=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$xcode_path"
          sudo xcode-select -s "$xcode_path/Contents/Developer"
      - run: brew install xcodegen
      - name: Create an isolated validation workspace
        run: |
          validation_tmp=$(mktemp -d "$RUNNER_TEMP/native-validation.XXXXXX")
          echo "VALIDATION_TMP=$validation_tmp" >> "$GITHUB_ENV"
          mkdir "$validation_tmp/apple"
          cp -R apple/Sources apple/Resources apple/Config apple/Tests apple/Engine apple/project.yml "$validation_tmp/apple/"
      - name: Reuse the published sync engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --pattern '*macos-arm64-direct.zip' --dir "$VALIDATION_TMP/published-mac"
          ditto -x -k "$VALIDATION_TMP"/published-mac/*.zip "$VALIDATION_TMP/published-mac/app"
          cp -R "$VALIDATION_TMP/published-mac/app/seafile-next.app/Contents/Resources/Engine/." "$VALIDATION_TMP/apple/Engine/"
      - name: Generate the temporary Xcode project
        run: |
          cd "$VALIDATION_TMP/apple"
          xcodegen generate
      - name: Start the iPhone simulator while Mac targets compile
        if: ${{ inputs.scope != 'settings' }}
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in d.items() if "iOS" in r for x in v if "iPhone" in x["name"]))')
          echo "VALIDATION_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          # Boot headlessly so Simulator cannot steal focus from Mac UI tests.
          xcrun simctl boot "$device_id" || true
      - name: Test native macOS controls and sync RPC
        env:
          VALIDATION_SCOPE: ${{ inputs.scope || 'full' }}
        run: |
          tests=()
          # Media changes are iOS-only. Keep the complete Core suite and compile
          # Mac targets, without repeating the unchanged Mac UI suite.
          if [[ "$VALIDATION_SCOPE" == media || "$VALIDATION_SCOPE" == photos ]]; then tests=(-only-testing:SeafileCoreTests); fi
          if [[ "$VALIDATION_SCOPE" == files ]]; then tests=(-only-testing:SeafileCoreTests -only-testing:SeafileMacUITests/DesktopFeatureTests/testNewFileUsesTheServersUniqueNameAndKeepsTheOriginal); fi
          if [[ "$VALIDATION_SCOPE" == localization ]]; then tests=(-only-testing:SeafileCoreTests -only-testing:SeafileMacUITests/LoginTests/testChineseLoginKeepsEditableFieldsAndTranslatedControls); fi
          if [[ "$VALIDATION_SCOPE" == documents ]]; then tests=(-only-testing:SeafileCoreTests -only-testing:SeafileMacUITests/LoginTests/testWikiSidebarLoadsOriginalCatalogAndPublishesOnlyAfterConfirmation -only-testing:SeafileMacUITests/LoginTests/testWikiCommentsKeepUnconfirmedInputAndDoNotRepeatAnAcceptedPost -only-testing:SeafileMacUITests/LoginTests/testServerAddressIsAnEmptyEditableFullWidthField); fi
          if [[ "$VALIDATION_SCOPE" == settings ]]; then tests=(-only-testing:SeafileCoreTests -only-testing:SeafileMacUITests/DesktopFeatureTests/testNativeSettingsHaveDockAndProxyControls -only-testing:SeafileMacUITests/DesktopFeatureTests/testSettingsPagesStayCompactAndSaveClosesOnlyAfterValidInput -only-testing:SeafileMacUITests/DesktopFeatureTests/testSavingTheMenuSettingsWindowClosesItWithoutClosingTheBrowser); fi
          SEAFILE_TEST_DAEMON="$VALIDATION_TMP/apple/Engine/seaf-daemon" xcodebuild -project "$VALIDATION_TMP/apple/SeafileNext.xcodeproj" -scheme SeafileNextMacDirect -destination 'platform=macOS' -derivedDataPath "$VALIDATION_TMP/build/direct" -resultBundlePath "$VALIDATION_TMP/build/MacTests.xcresult" "${tests[@]}" CODE_SIGNING_ALLOWED=NO test
      - name: Test iPhone navigation and login
        if: ${{ !cancelled() && env.VALIDATION_TMP != '' }}
        env:
          VALIDATION_SCOPE: ${{ inputs.scope || 'full' }}
        run: |
          tests=()
          case "$VALIDATION_SCOPE" in
            full) ;;
            settings)
              # Settings layout is Mac-only; still compile the iPhone app and
              # File Provider without repeating unchanged simulator UI tests.
              xcodebuild -project "$VALIDATION_TMP/apple/SeafileNext.xcodeproj" -scheme SeafileNextiOS -destination 'generic/platform=iOS Simulator' -derivedDataPath "$VALIDATION_TMP/build/ios" CODE_SIGNING_ALLOWED=NO build
              exit 0 ;;
            documents) tests=(
              -only-testing:SeafileiOSUITests/NavigationTests/testWikiListsOldAndGroupContentAndKeepsManagementChangesAfterRefresh
              -only-testing:SeafileiOSUITests/NavigationTests/testWikiCommentsPostReplyResolveAndDeleteThroughOriginalServerAPI
              ) ;;
            photos) tests=(
              -only-testing:SeafileiOSUITests/NavigationTests/testHEICBackupCanUseJPEGWithoutRepeatingOrChangingExistingBackups
              -only-testing:SeafileiOSUITests/NavigationTests/testPhotoKitExportsAnActualSimulatorPhotoAndDoesNotBackItUpAgain
              -only-testing:SeafileiOSUITests/NavigationTests/testPhotoBackupUploadsPhotoVideoAndLivePairOnce
              -only-testing:SeafileiOSUITests/NavigationTests/testNativeTextEditingUploadsTheEditAndPreviewLoadsTheNewContents
              ) ;;
            media) tests=(
              -only-testing:SeafileiOSUITests/NavigationTests/testImageGalleryStartsAtTheSelectedPhotoAndCanNavigateWithoutUnstarring
              -only-testing:SeafileiOSUITests/NavigationTests/testPhotoKitExportsAnActualSimulatorPhotoAndDoesNotBackItUpAgain
              -only-testing:SeafileiOSUITests/NavigationTests/testLegacyServerSignInCanBeCancelledBeforeUsingPasswordLogin
              ) ;;
            files) tests=(
              -only-testing:SeafileiOSUITests/NavigationTests/testNewFileUsesTheServersUniqueNameAndKeepsTheOriginal
              -only-testing:SeafileiOSUITests/NavigationTests/testNativeTextEditingUploadsTheEditAndPreviewLoadsTheNewContents
              ) ;;
            localization) tests=(
              -only-testing:SeafileiOSUITests/NavigationTests/testChineseNewFileLabelsCreateAnEditableFile
              ) ;;
            sign-in) tests=(
              -only-testing:SeafileiOSUITests/NavigationTests/testLegacyServerSignInCanBeCancelledBeforeUsingPasswordLogin
              -only-testing:SeafileiOSUITests/NavigationTests/testPasswordSignInOpensFilesInsteadOfAccountSidebar
              -only-testing:SeafileiOSUITests/NavigationTests/testSSOOnlyRequiresServerAddress
              ) ;;
            *) echo 'Unknown validation scope' >&2; exit 2 ;;
          esac
          device_id="$VALIDATION_DEVICE_ID"
          open -a Simulator --args -CurrentDeviceUDID "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project "$VALIDATION_TMP/apple/SeafileNext.xcodeproj" -scheme SeafileNextiOS -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath "$VALIDATION_TMP/build/ios" CODE_SIGNING_ALLOWED=NO build-for-testing
          xcrun simctl install "$device_id" "$VALIDATION_TMP/build/ios/Build/Products/Debug-iphonesimulator/seafile-next.app"
          xcrun simctl privacy "$device_id" grant photos io.felixbennett.seafile
          xcrun simctl addmedia "$device_id" "$VALIDATION_TMP/apple/Resources/Assets.xcassets/AppIcon.appiconset/mac-512.png"
          xcodebuild -project "$VALIDATION_TMP/apple/SeafileNext.xcodeproj" -scheme SeafileNextiOS -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath "$VALIDATION_TMP/build/ios" -resultBundlePath "$VALIDATION_TMP/build/iPhoneTests.xcresult" -parallel-testing-enabled NO "${tests[@]}" CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Build sandboxed Mac app and File Provider
        if: ${{ !cancelled() && env.VALIDATION_TMP != '' }}
        run: xcodebuild -project "$VALIDATION_TMP/apple/SeafileNext.xcodeproj" -scheme SeafileNextMacStore -destination 'platform=macOS' -derivedDataPath "$VALIDATION_TMP/build/store" CODE_SIGNING_ALLOWED=NO build
      - name: Export screenshots
        if: always()
        run: |
          if [[ -d "$VALIDATION_TMP/build/direct/Build/Products/Debug/seafile-next.app" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "$VALIDATION_TMP/build/direct/Build/Products/Debug/seafile-next.app" "$VALIDATION_TMP/build/native-mac-debug.zip"
          fi
          for name in MacTests iPhoneTests; do
            if [[ -d "$VALIDATION_TMP/build/$name.xcresult" ]]; then
              xcrun xcresulttool export attachments --path "$VALIDATION_TMP/build/$name.xcresult" --output-path "$VALIDATION_TMP/build/$name-screenshots"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-apple-validation
          retention-days: 7
          path: |
            ${{ env.VALIDATION_TMP }}/build/native-mac-debug.zip
            ${{ env.VALIDATION_TMP }}/build/*.xcresult
            ${{ env.VALIDATION_TMP }}/build/*-screenshots
      - name: Delete the temporary validation workspace
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          value = os.environ.get('VALIDATION_TMP')
          if value:
              root = Path(value).resolve()
              assert root.is_relative_to(Path(os.environ['RUNNER_TEMP']).resolve()) and root.name.startswith('native-validation.')
              shutil.rmtree(root, ignore_errors=True)
          PY
