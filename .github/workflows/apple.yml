name: Native Apple clients
on:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apple/**', 'sync/**', 'tools/*apple*', '.github/workflows/apple.yml']
    tags: ['apple-v*']
permissions:
  contents: write
concurrency:
  group: apple-signing
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: haiwen/libsearpc
          ref: 23d5df62815fb3b7825bf4e1a28b29af701e8cb2
          path: libsearpc
      - name: Select stable Xcode 26
        run: |
          xcode_path=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$xcode_path"
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version
      - name: Install build dependencies
        run: |
          brew install xcodegen autoconf automake libtool pkg-config gettext vala glib jansson libevent libwebsockets openssl@3 sqlite zlib argon2 dylibbundler
      - name: Bundle sync engine
        run: tools/build_apple_engine.sh
      - name: Generate native projects
        working-directory: apple
        run: xcodegen generate
      - name: Test APIs and build native Mac client
        run: |
          SEAFILE_TEST_DAEMON="$PWD/apple/Engine/seaf-daemon" xcodebuild -project apple/SeafileNext.xcodeproj -scheme SeafileNextMacDirect -destination 'platform=macOS' -derivedDataPath apple/build/direct -resultBundlePath apple/build/CoreTests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Test iPhone navigation and sign-in controls
        # Compilation and first simulator automation startup can consume over
        # half the previous budget before the full regression suite starts.
        timeout-minutes: 35
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in devices.items() if "iOS" in runtime for d in items if "iPhone" in d["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$device_id" || true
          open -a Simulator --args -CurrentDeviceUDID "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project apple/SeafileNext.xcodeproj -scheme SeafileNextiOS -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath apple/build/ios CODE_SIGNING_ALLOWED=NO build-for-testing
          xcrun simctl install "$device_id" apple/build/ios/Build/Products/Debug-iphonesimulator/seafile-next.app
          xcrun simctl privacy "$device_id" grant photos io.felixbennett.seafile
          xcrun simctl addmedia "$device_id" apple/Resources/Assets.xcassets/AppIcon.appiconset/mac-512.png
          xcodebuild -project apple/SeafileNext.xcodeproj -scheme SeafileNextiOS -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath apple/build/ios -resultBundlePath apple/build/iPhoneTests.xcresult -parallel-testing-enabled NO -test-iterations 2 -retry-tests-on-failure CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Package non-sandbox Mac client
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          version_args=()
          if [[ -n "$RELEASE_VERSION" ]]; then version_args=("MARKETING_VERSION=$RELEASE_VERSION"); fi
          xcodebuild -project apple/SeafileNext.xcodeproj -scheme SeafileNextMacDirect -configuration Release -destination 'platform=macOS' -derivedDataPath apple/build/direct CODE_SIGNING_ALLOWED=NO "${version_args[@]}" build
          mkdir -p dist
          app=apple/build/direct/Build/Products/Release/seafile-next.app
          codesign --force --deep --sign - "$app"
          codesign --force --sign - --entitlements apple/Config/FinderSync.entitlements "$app/Contents/PlugIns/SeafileFinderSync.appex"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/seafile-next-macos-arm64-direct.zip
      - name: Export iPhone test screenshots
        if: always()
        run: |
          if [[ -d apple/build/iPhoneTests.xcresult ]]; then
            xcrun xcresulttool export attachments --path apple/build/iPhoneTests.xcresult --output-path apple/build/iPhoneScreenshots
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-apple-validation
          path: |
            dist/*.zip
            apple/build/CoreTests.xcresult
            apple/build/iPhoneTests.xcresult
            apple/build/iPhoneScreenshots
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install signing dependencies
        run: python -m pip install 'PyJWT[crypto]==2.10.1' 'cryptography>=45,<48'
      - name: Prepare reusable Apple signing
        env:
          GH_TOKEN: ${{ github.token }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python tools/apple_signing.py --directory "$RUNNER_TEMP/apple-signing"
      - name: Archive and upload iOS to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: tools/publish_apple.sh ios
      - name: Retain unsigned iPhone device package
        if: ${{ always() && hashFiles('dist/*.ipa') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: seafile-next-ios-unsigned
          path: dist/*.ipa
          if-no-files-found: error
      - name: Verify iOS TestFlight processing
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python tools/apple_testflight.py --build "$APPLE_BUILD_NUMBER" --platform IOS
      - name: Archive and upload macOS to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: tools/publish_apple.sh mac
      - name: Verify macOS TestFlight processing
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python tools/apple_testflight.py --build "$APPLE_BUILD_NUMBER" --platform MAC_OS
      - name: Clean temporary signing material
        if: always()
        run: |
          if [[ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$APPLE_SIGNING_KEYCHAIN"; fi
          rm -rf "$RUNNER_TEMP/apple-signing"
