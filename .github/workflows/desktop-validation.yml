name: Retained desktop client validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/src/api/server-info.h', 'desktop/tests/**', '.github/workflows/desktop-validation.yml']
permissions:
  contents: read
jobs:
  capabilities:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Build retained server feature contract tests
        run: cmake -S desktop/tests -B build-contracts
      - run: cmake --build build-contracts --config Release
      - name: Verify feature persistence and changed server capabilities
        run: ctest --test-dir build-contracts -C Release --output-on-failure
