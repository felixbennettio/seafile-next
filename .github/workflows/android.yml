name: Android tests and APK

on:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''
  push:
    branches:
      - main
    paths: ['android/**', '.github/workflows/android.yml']
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      signing_only:
        description: Verify the fixed signing key without rebuilding the APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: ${{ !inputs.signing_only }}
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed Android signing identity
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          ANDROID_DEBUG_CERT_SHA256: ${{ vars.ANDROID_DEBUG_CERT_SHA256 }}
        run: |
          python3 ../tools/restore_android_signing.py
          # Verify a second restore keeps exactly the same signer.
          python3 ../tools/restore_android_signing.py

      - name: Create key.properties for debug signing
        if: ${{ !inputs.signing_only }}
        run: cp app/key.properties.example app/key.properties

      - name: Run URL and refresh regression tests
        if: ${{ !inputs.signing_only }}
        run: >-
          ./gradlew testDebugUnitTest
          --tests 'com.seafile.seadroid2.util.UtilsTest'
          --tests 'com.seafile.seadroid2.ui.repo.RepoViewModelTest'
          --tests 'com.seafile.seadroid2.ui.star.StarredViewModelTest'
          --tests 'com.seafile.seadroid2.framework.util.StarredCacheTest'
          --no-daemon --stacktrace

      - name: Upload test reports
        if: ${{ always() && !inputs.signing_only }}
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

      - name: Build debug APK
        if: ${{ !inputs.signing_only }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: ${{ !inputs.signing_only }}
        uses: actions/upload-artifact@v4
        with:
          name: seafile-next-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
