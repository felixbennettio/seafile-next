name: Linux desktop client
on:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      integration_only:
        description: Add local-file protocol integration to the published DEB without rebuilding its binaries
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', 'sync/**', 'tools/package_linux.sh', '.github/workflows/linux.yml']
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    if: ${{ inputs.integration_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reuse published binaries and add desktop protocol integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          linux_tmp=$(mktemp -d "$RUNNER_TEMP/linux-build.XXXXXX")
          echo "LINUX_BUILD_TMP=$linux_tmp" >> "$GITHUB_ENV"
          integration_script="$GITHUB_WORKSPACE/tools/install_linux_integration.sh"
          cd "$linux_tmp"
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern '*linux-amd64.deb' --dir old-package
          original=$(find old-package -name '*.deb' -print -quit)
          dpkg-deb -R "$original" linux-package
          find linux-package/opt -type f -print0 | sort -z | xargs -0 sha256sum > original-binaries.sha256
          bash "$integration_script" linux-package
          sha256sum --check original-binaries.sha256
          desktop-file-validate linux-package/usr/share/applications/*.desktop
          update-desktop-database linux-package/usr/share/applications
          grep -F 'x-scheme-handler/seafile=seafile-next-link.desktop;' linux-package/usr/share/applications/mimeinfo.cache
          rm linux-package/usr/share/applications/mimeinfo.cache
          test -x linux-package/DEBIAN/postinst
          test -x linux-package/DEBIAN/postrm
          mkdir dist
          dpkg-deb --build --root-owner-group linux-package dist/seafile-next-linux-amd64.deb
      - uses: actions/upload-artifact@v7
        with:
          name: seafile-next-linux-amd64
          path: ${{ env.LINUX_BUILD_TMP }}/dist/*.deb
          if-no-files-found: error
      - name: Remove temporary integration files
        if: ${{ always() && env.LINUX_BUILD_TMP != '' }}
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['LINUX_BUILD_TMP'])
          assert not root.is_symlink() and root.resolve().parent == Path(os.environ['RUNNER_TEMP']).resolve()
          assert root.name.startswith('linux-build.')
          shutil.rmtree(root)
          PY
  build:
    if: ${{ !inputs.integration_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: haiwen/libsearpc
          ref: 23d5df62815fb3b7825bf4e1a28b29af701e8cb2
          path: libsearpc
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config valac intltool cmake ninja-build libglib2.0-dev libjansson-dev libevent-dev libwebsockets-dev libcurl4-openssl-dev libssl-dev libsqlite3-dev libargon2-dev uuid-dev zlib1g-dev qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-webengine-dev qt6-5compat-dev libqt6serialport6-dev dpkg-dev patchelf
      - name: Create an isolated Linux build workspace
        run: |
          linux_tmp=$(mktemp -d "$RUNNER_TEMP/linux-build.XXXXXX")
          echo "LINUX_BUILD_TMP=$linux_tmp" >> "$GITHUB_ENV"
          mkdir "$linux_tmp/temporary"
          echo "TMPDIR=$linux_tmp/temporary" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          echo "LINUX_BUILD_SOURCE=$linux_tmp/source" >> "$GITHUB_ENV"
          LINUX_TMP="$linux_tmp" PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.ci_workspace import export_tree
          checkout = Path(os.environ['GITHUB_WORKSPACE'])
          source = Path(os.environ['LINUX_TMP']) / 'source'
          export_tree(checkout, source, ('desktop', 'sync', 'tools'))
          export_tree(checkout / 'libsearpc', source / 'libsearpc')
          PY
      - name: Build sync engine and desktop client
        working-directory: ${{ env.LINUX_BUILD_SOURCE }}
        run: |
          prefix="$LINUX_BUILD_SOURCE/usr"
          export PATH="$prefix/bin:$PATH"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$prefix/lib:${LD_LIBRARY_PATH:-}"
          cd libsearpc
          ./autogen.sh
          ./configure --prefix="$prefix" --disable-compile-demo
          make -j2 && make install
          cd ../sync
          ./autogen.sh
          ./configure --prefix="$prefix"
          make -j2 && make install
          cd ..
          cmake -S desktop -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_SHIBBOLETH_SUPPORT=ON -DBUILD_SPARKLE_SUPPORT=OFF
          cmake --build build-linux --parallel 2
          tools/package_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: seafile-next-linux-amd64
          path: ${{ env.LINUX_BUILD_SOURCE }}/dist/*.deb
          if-no-files-found: error
      - name: Remove temporary Linux build files
        if: ${{ always() && env.LINUX_BUILD_TMP != '' }}
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['LINUX_BUILD_TMP'])
          assert not root.is_symlink() and root.resolve().parent == Path(os.environ['RUNNER_TEMP']).resolve()
          assert root.name.startswith('linux-build.')
          shutil.rmtree(root)
          PY
